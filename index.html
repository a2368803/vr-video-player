<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <title>VR 影片播放器</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      background: #080810;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Screen base ── */
    .screen {
      display: none;
      position: fixed;
      inset: 0;
    }
    .screen.active { display: flex; }

    /* ── Home Screen ── */
    #home-screen {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 32px 24px;
      background: radial-gradient(ellipse at 50% 0%, #1a1040 0%, #080810 70%);
    }
    .logo-wrap { text-align: center; }
    .logo { font-size: 64px; display: block; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    .app-title {
      font-size: 30px; font-weight: 800; letter-spacing: -0.5px;
      background: linear-gradient(135deg, #a78bfa 0%, #60a5fa 50%, #34d399 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-top: 8px;
    }
    .app-sub { font-size: 13px; color: #666; text-align: center; margin-top: 4px; }

    .url-box {
      width: 100%; max-width: 500px;
      background: #12121e;
      border: 1.5px solid #2a2a3e;
      border-radius: 18px;
      padding: 14px 18px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    #url-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: #f0f0f0;
      font-size: 15px;
      caret-color: #a78bfa;
    }
    #url-input::placeholder { color: #44445a; }
    .paste-btn {
      background: #2a2a3e;
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      color: #a78bfa;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .paste-btn:active { opacity: 0.7; }

    .btn-main {
      width: 100%; max-width: 500px;
      padding: 16px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      border: none;
      border-radius: 18px;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: transform 0.1s, opacity 0.15s;
      box-shadow: 0 4px 24px rgba(124,58,237,0.35);
    }
    .btn-main:active { transform: scale(0.97); opacity: 0.85; }
    .btn-main:disabled { opacity: 0.4; }

    .supported-list {
      display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 400px;
    }
    .tag {
      background: #12121e;
      border: 1px solid #2a2a3e;
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 12px;
      color: #666;
    }

    /* ── Settings Screen ── */
    #settings-screen {
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 20px;
      padding: 56px 20px 30px;
      overflow-y: auto;
      background: #080810;
    }
    .back-btn {
      position: fixed;
      top: 16px; left: 16px;
      width: 44px; height: 44px;
      background: #12121e;
      border: 1px solid #2a2a3e;
      border-radius: 50%;
      color: #f0f0f0;
      font-size: 20px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      z-index: 10;
    }
    .section-title { font-size: 20px; font-weight: 700; align-self: flex-start; }
    .preview-wrap {
      width: 100%; max-width: 520px;
      aspect-ratio: 16/9;
      background: #0e0e1a;
      border: 1px solid #2a2a3e;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
    }
    .preview-wrap video,
    .preview-wrap iframe {
      width: 100%; height: 100%; border: none; object-fit: contain;
    }
    .preview-label {
      position: absolute;
      top: 8px; left: 10px;
      background: rgba(0,0,0,0.6);
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 12px;
      color: #aaa;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      max-width: 520px;
    }
    .mode-card {
      background: #12121e;
      border: 2px solid #2a2a3e;
      border-radius: 16px;
      padding: 18px 14px 14px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .mode-card.active {
      border-color: #7c3aed;
      background: rgba(124,58,237,0.12);
    }
    .mode-card .mc-icon { font-size: 34px; display: block; margin-bottom: 8px; }
    .mode-card .mc-name { font-size: 14px; font-weight: 700; }
    .mode-card .mc-desc { font-size: 11px; color: #555; margin-top: 3px; }

    .setting-row {
      width: 100%; max-width: 520px;
      background: #12121e;
      border: 1px solid #2a2a3e;
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .setting-label { font-size: 14px; font-weight: 600; }
    .setting-hint { font-size: 11px; color: #555; margin-top: 3px; }
    .toggle {
      width: 48px; height: 28px;
      background: #2a2a3e;
      border-radius: 14px;
      position: relative;
      cursor: pointer;
      transition: background 0.3s;
      flex-shrink: 0;
      border: none;
    }
    .toggle.on { background: #7c3aed; }
    .toggle::after {
      content: '';
      position: absolute;
      width: 22px; height: 22px;
      background: #fff;
      border-radius: 50%;
      top: 3px; left: 3px;
      transition: transform 0.3s;
    }
    .toggle.on::after { transform: translateX(20px); }

    .iod-row {
      width: 100%; max-width: 520px;
    }
    .iod-label { font-size: 13px; color: #888; margin-bottom: 8px; display: flex; justify-content: space-between; }
    input[type=range] {
      width: 100%;
      accent-color: #7c3aed;
    }

    /* ── VR Screen ── */
    #vr-screen {
      flex-direction: column;
      background: #000;
    }
    #vr-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

    #yt-vr-wrap {
      display: none;
      position: fixed; inset: 0;
      flex-direction: row;
    }
    #yt-vr-wrap.active { display: flex; }
    .yt-eye {
      flex: 1;
      overflow: hidden;
      position: relative;
      background: #000;
    }
    .yt-eye iframe {
      position: absolute;
      border: none;
    }

    .vr-divider {
      position: fixed;
      left: 50%; top: 0;
      width: 2px; height: 100%;
      background: rgba(255,255,255,0.12);
      transform: translateX(-50%);
      z-index: 50;
      pointer-events: none;
    }

    #vr-hud {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
    }
    #vr-hud.hidden { opacity: 0; }
    #vr-hud.hidden .vr-hud-btn { pointer-events: none; }

    .vr-hud-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      gap: 10px;
    }
    .vr-hud-btn {
      background: rgba(0,0,0,0.65);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 22px;
      padding: 8px 18px;
      color: #f0f0f0;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      pointer-events: all;
      backdrop-filter: blur(4px);
    }
    .vr-hud-btn:active { opacity: 0.7; }
    .vr-hud-btn.exit { border-color: rgba(255,80,80,0.5); color: #ff9090; }
    .vr-hud-btn.on { border-color: #4ade80; color: #4ade80; }

    .vr-hud-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 10px;
    }

    /* ── Loading ── */
    #loading {
      position: fixed;
      inset: 0;
      background: rgba(8,8,16,0.92);
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      backdrop-filter: blur(6px);
    }
    #loading.active { display: flex; }
    .spinner {
      width: 52px; height: 52px;
      border: 3px solid rgba(124,58,237,0.25);
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #666; font-size: 14px; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20,20,32,0.92);
      border: 1px solid #2a2a3e;
      border-radius: 22px;
      padding: 10px 22px;
      font-size: 13px;
      color: #f0f0f0;
      z-index: 998;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      white-space: nowrap;
      backdrop-filter: blur(6px);
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

<!-- Loading -->
<div id="loading"><div class="spinner"></div><p class="loading-text">載入中...</p></div>
<div id="toast"></div>

<!-- ════════════════ Home Screen ════════════════ -->
<div id="home-screen" class="screen active">
  <div class="logo-wrap">
    <span class="logo">🥽</span>
    <div class="app-title">VR 影片播放器</div>
    <div class="app-sub">iPhone 15 Pro × VR 盒子</div>
  </div>

  <div class="url-box">
    <input id="url-input" type="url" placeholder="貼上影片網址..." autocomplete="off" autocorrect="off" spellcheck="false" inputmode="url">
    <button class="paste-btn" id="paste-btn">貼上</button>
  </div>

  <button class="btn-main" id="load-btn">載入影片</button>

  <div class="supported-list">
    <span class="tag">YouTube</span>
    <span class="tag">MP4 / WebM</span>
    <span class="tag">M3U8 HLS</span>
    <span class="tag">Vimeo</span>
    <span class="tag">360° 影片</span>
    <span class="tag">3D 分屏</span>
  </div>
</div>

<!-- ════════════════ Settings Screen ════════════════ -->
<div id="settings-screen" class="screen">
  <button class="back-btn" id="settings-back">‹</button>

  <p class="section-title">影片預覽</p>

  <div class="preview-wrap" id="preview-wrap">
    <span class="preview-label" id="source-label"></span>
  </div>

  <p class="section-title" style="margin-top:4px">VR 模式</p>

  <div class="mode-grid">
    <div class="mode-card active" data-mode="flat">
      <span class="mc-icon">🎬</span>
      <div class="mc-name">大螢幕模式</div>
      <div class="mc-desc">普通影片 · 弧形大屏</div>
    </div>
    <div class="mode-card" data-mode="360">
      <span class="mc-icon">🌐</span>
      <div class="mc-name">360° 環景</div>
      <div class="mc-desc">環景影片 · 球形投影</div>
    </div>
    <div class="mode-card" data-mode="sbs">
      <span class="mc-icon">👓</span>
      <div class="mc-name">3D 左右分屏</div>
      <div class="mc-desc">SBS 3D 立體影片</div>
    </div>
    <div class="mode-card" data-mode="tb">
      <span class="mc-icon">🔭</span>
      <div class="mc-name">3D 上下分屏</div>
      <div class="mc-desc">TB 3D 立體影片</div>
    </div>
  </div>

  <div class="setting-row">
    <div>
      <div class="setting-label">陀螺儀視角控制</div>
      <div class="setting-hint">移動手機轉換觀看方向</div>
    </div>
    <button class="toggle on" id="gyro-toggle"></button>
  </div>

  <div class="setting-row">
    <div>
      <div class="setting-label">鏡頭桶形失真校正</div>
      <div class="setting-hint">補償 VR 盒子鏡頭失真（僅限直接影片）</div>
    </div>
    <button class="toggle on" id="distort-toggle"></button>
  </div>

  <div class="iod-row">
    <div class="iod-label">
      <span>瞳距 (IPD)</span>
      <span id="iod-val">64 mm</span>
    </div>
    <input type="range" id="iod-slider" min="52" max="76" value="64" step="1">
  </div>

  <button class="btn-main" id="enter-vr-btn" style="max-width:520px">🥽 進入 VR 模式</button>
</div>

<!-- ════════════════ VR Screen ════════════════ -->
<div id="vr-screen" class="screen">
  <canvas id="vr-canvas"></canvas>

  <!-- YouTube / Vimeo split view -->
  <div id="yt-vr-wrap">
    <div class="yt-eye" id="eye-left"></div>
    <div class="yt-eye" id="eye-right"></div>
  </div>

  <div class="vr-divider"></div>

  <!-- HUD -->
  <div id="vr-hud">
    <div class="vr-hud-top">
      <button class="vr-hud-btn exit" id="vr-exit-btn">✕ 退出</button>
      <button class="vr-hud-btn" id="vr-gyro-btn">📱 陀螺儀</button>
    </div>
    <div class="vr-hud-bottom">
      <button class="vr-hud-btn" id="vr-reset-btn">↺ 重設視角</button>
    </div>
  </div>
</div>

<!-- Hidden video for Three.js -->
<video id="bg-video" style="display:none" crossorigin="anonymous" playsinline webkit-playsinline loop></video>

<script>
/* ═══════════════════════════════════════════════
   State
═══════════════════════════════════════════════ */
const S = {
  url: '',
  mode: 'flat',      // flat | 360 | sbs | tb
  source: 'youtube', // youtube | vimeo | direct
  ytId: '',
  useGyro: true,
  useDistort: true,
  iod: 64,           // mm
  gyroActive: false,
  orient: { alpha: 0, beta: 90, gamma: 0 },
  resetQuat: null,
  hudVisible: true,
  hlsInstance: null,
};

/* ═══════════════════════════════════════════════
   DOM refs
═══════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const homeScreen     = $('home-screen');
const settingsScreen = $('settings-screen');
const vrScreen       = $('vr-screen');
const urlInput       = $('url-input');
const previewWrap    = $('preview-wrap');
const sourceLabel    = $('source-label');
const ytVrWrap       = $('yt-vr-wrap');
const eyeLeft        = $('eye-left');
const eyeRight       = $('eye-right');
const vrCanvas       = $('vr-canvas');
const bgVideo        = $('bg-video');
const vrHud          = $('vr-hud');
const gyroToggle     = $('gyro-toggle');
const distortToggle  = $('distort-toggle');
const iodSlider      = $('iod-slider');
const iodVal         = $('iod-val');
const loadingEl      = $('loading');
const toastEl        = $('toast');

/* ═══════════════════════════════════════════════
   UI helpers
═══════════════════════════════════════════════ */
function showLoading()  { loadingEl.classList.add('active'); }
function hideLoading()  { loadingEl.classList.remove('active'); }

let toastTimer;
function toast(msg, dur = 2800) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), dur);
}

function switchScreen(to) {
  [homeScreen, settingsScreen, vrScreen].forEach(s => s.classList.remove('active'));
  to.classList.add('active');
}

/* ═══════════════════════════════════════════════
   URL detection
═══════════════════════════════════════════════ */
function detectURL(raw) {
  try {
    const u = new URL(raw);
    const host = u.hostname.replace('www.', '');

    if (host === 'youtube.com' || host === 'youtu.be' || host === 'm.youtube.com') {
      let id = u.searchParams.get('v') || '';
      if (!id && host === 'youtu.be') id = u.pathname.slice(1).split('?')[0];
      if (!id && u.pathname.includes('/shorts/')) id = u.pathname.split('/shorts/')[1].split('/')[0];
      if (!id && u.pathname.includes('/embed/')) id = u.pathname.split('/embed/')[1].split('/')[0];
      return id ? { source: 'youtube', id } : null;
    }

    if (host === 'vimeo.com') {
      const id = u.pathname.replace(/\//g, '');
      return id ? { source: 'vimeo', id } : null;
    }

    const ext = u.pathname.split('.').pop().toLowerCase();
    if (['mp4', 'webm', 'ogv', 'mov', 'm3u8', 'ts'].includes(ext) || raw.startsWith('blob:')) {
      return { source: 'direct', ext };
    }

    // Try direct anyway
    return { source: 'direct', ext: '' };
  } catch {
    return null;
  }
}

function ytEmbed(id, extra = '') {
  return `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&playsinline=1&rel=0&modestbranding=1&controls=1${extra}`;
}

/* ═══════════════════════════════════════════════
   Load Video → Settings Screen
═══════════════════════════════════════════════ */
async function loadVideo() {
  const url = urlInput.value.trim();
  if (!url) { toast('請貼上影片網址'); return; }

  S.url = url;
  showLoading();
  clearPreview();

  const info = detectURL(url);
  if (!info) { hideLoading(); toast('無法識別的網址格式'); return; }

  S.source = info.source;
  S.ytId   = info.id || '';

  if (info.source === 'youtube') {
    sourceLabel.textContent = 'YouTube';
    const iframe = document.createElement('iframe');
    iframe.src = ytEmbed(info.id, '&mute=1');
    iframe.allow = 'autoplay; encrypted-media; gyroscope';
    iframe.allowFullscreen = true;
    previewWrap.appendChild(iframe);

  } else if (info.source === 'vimeo') {
    sourceLabel.textContent = 'Vimeo';
    const iframe = document.createElement('iframe');
    iframe.src = `https://player.vimeo.com/video/${info.id}?autoplay=1&muted=1`;
    iframe.allow = 'autoplay; fullscreen';
    iframe.allowFullscreen = true;
    previewWrap.appendChild(iframe);

  } else {
    sourceLabel.textContent = info.ext ? info.ext.toUpperCase() : '直接連結';
    const v = document.createElement('video');
    v.controls = true;
    v.muted = true;
    v.autoplay = true;
    v.setAttribute('playsinline', '');
    v.setAttribute('webkit-playsinline', '');

    if ((info.ext === 'm3u8' || url.includes('.m3u8')) && window.Hls && Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(v);
    } else {
      v.src = url;
    }

    previewWrap.appendChild(v);
  }

  hideLoading();
  switchScreen(settingsScreen);
}

function clearPreview() {
  const old = previewWrap.querySelector('video, iframe');
  if (old) { if (old.tagName === 'VIDEO') old.src = ''; old.remove(); }
}

/* ═══════════════════════════════════════════════
   Mode cards
═══════════════════════════════════════════════ */
document.querySelectorAll('.mode-card').forEach(card => {
  card.addEventListener('click', () => {
    document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('active'));
    card.classList.add('active');
    S.mode = card.dataset.mode;
  });
});

/* Toggles */
gyroToggle.addEventListener('click', () => {
  S.useGyro = !S.useGyro;
  gyroToggle.classList.toggle('on', S.useGyro);
});
distortToggle.addEventListener('click', () => {
  S.useDistort = !S.useDistort;
  distortToggle.classList.toggle('on', S.useDistort);
});
iodSlider.addEventListener('input', () => {
  S.iod = +iodSlider.value;
  iodVal.textContent = S.iod + ' mm';
});

/* ═══════════════════════════════════════════════
   THREE.JS VR
═══════════════════════════════════════════════ */
let renderer3, scene3, camL, camR, mainCam;
let videoTex, hlsObj;
let rafId;
let userYaw = 0, userPitch = 0;
let dragState = null;

// Barrel distortion post-processing
let rtScene, rtCam, rtTarget, rtLeft, rtRight, distortL, distortR;

const BARREL_VS = `
varying vec2 vUv;
void main() {
  vUv = uv;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}`;

const BARREL_FS = `
uniform sampler2D tDiffuse;
uniform vec2 center;
uniform float k1;
uniform float k2;
varying vec2 vUv;
void main() {
  vec2 uv = vUv - center;
  float r2 = dot(uv, uv);
  vec2 d = uv * (1.0 + k1 * r2 + k2 * r2 * r2);
  vec2 final = d + center;
  if (final.x < 0.0 || final.x > 1.0 || final.y < 0.0 || final.y > 1.0) {
    gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
  } else {
    gl_FragColor = texture2D(tDiffuse, final);
  }
}`;

function buildThreeVR() {
  const W = window.innerWidth, H = window.innerHeight;
  const eyeW = W / 2;
  const aspect = eyeW / H;
  const eyeSep = S.iod / 1000;

  // Scene
  scene3 = new THREE.Scene();
  scene3.background = new THREE.Color(0x000000);

  // Renderer
  renderer3 = new THREE.WebGLRenderer({ canvas: vrCanvas, antialias: true, alpha: false });
  renderer3.setSize(W, H);
  renderer3.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  // Main camera
  mainCam = new THREE.PerspectiveCamera(90, aspect, 0.01, 1000);
  mainCam.position.set(0, 0, 0);

  camL = new THREE.PerspectiveCamera(90, aspect, 0.01, 1000);
  camR = new THREE.PerspectiveCamera(90, aspect, 0.01, 1000);

  // Video setup
  bgVideo.src = '';
  if (S.hlsInstance) { S.hlsInstance.destroy(); S.hlsInstance = null; }

  const url = S.url;
  const isHLS = url.includes('.m3u8');

  if (isHLS && window.Hls && Hls.isSupported()) {
    hlsObj = new Hls();
    hlsObj.loadSource(url);
    hlsObj.attachMedia(bgVideo);
    S.hlsInstance = hlsObj;
  } else if (isHLS && bgVideo.canPlayType('application/vnd.apple.mpegurl')) {
    bgVideo.src = url; // Native HLS on Safari
  } else {
    bgVideo.src = url;
  }

  bgVideo.load();
  bgVideo.muted = false;
  bgVideo.play().catch(() => {
    bgVideo.muted = true;
    bgVideo.play();
    toast('音訊需要互動才能播放，請點一下螢幕');
  });

  videoTex = new THREE.VideoTexture(bgVideo);
  videoTex.minFilter = THREE.LinearFilter;
  videoTex.magFilter = THREE.LinearFilter;
  videoTex.format = THREE.RGBFormat;

  buildGeometry();

  // Distortion setup
  if (S.useDistort) buildDistortionPasses(W, H);

  vrCanvas.style.display = 'block';
  ytVrWrap.classList.remove('active');

  S.resetQuat = null;
  renderLoop();
}

function buildGeometry() {
  scene3.children.filter(c => c.isMesh).forEach(m => { scene3.remove(m); });

  const mat = new THREE.MeshBasicMaterial({ map: videoTex, side: THREE.BackSide });

  if (S.mode === 'flat') {
    // Curved screen — partial sphere
    const geo = new THREE.SphereGeometry(8, 64, 32,
      Math.PI / 2 - Math.PI * 0.55, Math.PI * 1.1,
      Math.PI / 2 - Math.PI * 0.32, Math.PI * 0.64
    );
    const mesh = new THREE.Mesh(geo, mat.clone());
    mesh.rotation.y = Math.PI;
    scene3.add(mesh);

  } else if (S.mode === '360') {
    const geo = new THREE.SphereGeometry(10, 64, 64);
    scene3.add(new THREE.Mesh(geo, mat.clone()));

  } else if (S.mode === 'sbs') {
    // Side-by-side 3D — geometry same, UV handled in render
    const geo = new THREE.SphereGeometry(10, 64, 64);
    scene3.add(new THREE.Mesh(geo, mat.clone()));

  } else if (S.mode === 'tb') {
    const geo = new THREE.SphereGeometry(10, 64, 64);
    scene3.add(new THREE.Mesh(geo, mat.clone()));
  }
}

function buildDistortionPasses(W, H) {
  // Render target — full screen
  rtTarget = new THREE.WebGLRenderTarget(W, H, {
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter
  });

  // Post-processing scene (flat quad)
  rtScene = new THREE.Scene();
  rtCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

  const k1 = 0.22, k2 = 0.08;

  // Left eye quad
  const geoL = new THREE.PlaneGeometry(1, 2);
  distortL = new THREE.Mesh(geoL, new THREE.ShaderMaterial({
    uniforms: {
      tDiffuse: { value: rtTarget.texture },
      center:   { value: new THREE.Vector2(0.25, 0.5) },
      k1: { value: k1 }, k2: { value: k2 }
    },
    vertexShader: BARREL_VS,
    fragmentShader: BARREL_FS
  }));
  distortL.position.x = -0.5;
  rtScene.add(distortL);

  // Right eye quad
  const geoR = new THREE.PlaneGeometry(1, 2);
  distortR = new THREE.Mesh(geoR, new THREE.ShaderMaterial({
    uniforms: {
      tDiffuse: { value: rtTarget.texture },
      center:   { value: new THREE.Vector2(0.75, 0.5) },
      k1: { value: k1 }, k2: { value: k2 }
    },
    vertexShader: BARREL_VS,
    fragmentShader: BARREL_FS
  }));
  distortR.position.x = 0.5;
  rtScene.add(distortR);
}

const _q  = new THREE.Quaternion();
const _q0 = new THREE.Quaternion();
const _q1 = new THREE.Quaternion(-Math.SQRT1_2, 0, 0, Math.SQRT1_2);
const _eu = new THREE.Euler();
const _zee = new THREE.Vector3(0, 0, 1);
const _up  = new THREE.Vector3(0, 1, 0);

function gyroToQuat(alpha, beta, gamma) {
  // Convert device orientation to camera quaternion
  _eu.set(
    THREE.MathUtils.degToRad(beta),
    THREE.MathUtils.degToRad(alpha),
    THREE.MathUtils.degToRad(-gamma),
    'YXZ'
  );
  _q.setFromEuler(_eu);
  _q.multiply(_q1);

  const orient = (window.screen.orientation && window.screen.orientation.angle) || window.orientation || 0;
  if (orient === 90 || orient === -270) {
    _q0.setFromAxisAngle(_zee, -Math.PI / 2);
  } else if (orient === -90 || orient === 270) {
    _q0.setFromAxisAngle(_zee, Math.PI / 2);
  } else {
    _q0.set(0, 0, 0, 1);
  }
  _q.multiply(_q0);
  return _q.clone();
}

function renderLoop() {
  rafId = requestAnimationFrame(renderLoop);
  if (!renderer3) return;

  if (videoTex) videoTex.needsUpdate = true;

  const W = window.innerWidth, H = window.innerHeight;
  const eyeW = W / 2;
  const eyeSep = S.iod / 1000;

  // Camera orientation
  if (S.gyroActive && S.useGyro) {
    const q = gyroToQuat(S.orient.alpha, S.orient.beta, S.orient.gamma);
    if (!S.resetQuat) {
      S.resetQuat = q.clone().invert();
    }
    const final = S.resetQuat.clone().multiply(q);
    mainCam.quaternion.copy(final);
  } else {
    // Touch/drag control
    const pitchQ = new THREE.Quaternion().setFromAxisAngle(
      new THREE.Vector3(1, 0, 0), THREE.MathUtils.degToRad(userPitch)
    );
    const yawQ = new THREE.Quaternion().setFromAxisAngle(
      _up, THREE.MathUtils.degToRad(userYaw)
    );
    mainCam.quaternion.multiplyQuaternions(yawQ, pitchQ);
  }

  // Eye positions
  const right = new THREE.Vector3(1, 0, 0).applyQuaternion(mainCam.quaternion);
  camL.quaternion.copy(mainCam.quaternion);
  camR.quaternion.copy(mainCam.quaternion);
  camL.position.copy(right).multiplyScalar(-eyeSep / 2);
  camR.position.copy(right).multiplyScalar(eyeSep / 2);
  camL.aspect = eyeW / H;
  camR.aspect = eyeW / H;
  camL.updateProjectionMatrix();
  camR.updateProjectionMatrix();

  // UV offsets for SBS / TB
  const mesh = scene3.children.find(c => c.isMesh);

  if (S.useDistort && rtTarget) {
    // Render both eyes into full render target, then apply distortion
    renderer3.setRenderTarget(rtTarget);
    renderer3.setScissorTest(true);

    // Left
    renderer3.setScissor(0, 0, eyeW, H);
    renderer3.setViewport(0, 0, eyeW, H);
    if (mesh && S.mode === 'sbs') setUV(mesh, 0, 0, 0.5, 1);
    else if (mesh && S.mode === 'tb') setUV(mesh, 0, 0.5, 1, 0.5);
    renderer3.render(scene3, camL);

    // Right
    renderer3.setScissor(eyeW, 0, eyeW, H);
    renderer3.setViewport(eyeW, 0, eyeW, H);
    if (mesh && S.mode === 'sbs') setUV(mesh, 0.5, 0, 0.5, 1);
    else if (mesh && S.mode === 'tb') setUV(mesh, 0, 0, 1, 0.5);
    else if (mesh) resetUV(mesh);
    renderer3.render(scene3, camR);

    // Apply barrel distortion
    renderer3.setRenderTarget(null);
    renderer3.setScissorTest(false);
    renderer3.setViewport(0, 0, W, H);
    renderer3.render(rtScene, rtCam);

  } else {
    renderer3.setRenderTarget(null);
    renderer3.setScissorTest(true);

    renderer3.setScissor(0, 0, eyeW, H);
    renderer3.setViewport(0, 0, eyeW, H);
    if (mesh && S.mode === 'sbs') setUV(mesh, 0, 0, 0.5, 1);
    else if (mesh && S.mode === 'tb') setUV(mesh, 0, 0.5, 1, 0.5);
    renderer3.render(scene3, camL);

    renderer3.setScissor(eyeW, 0, eyeW, H);
    renderer3.setViewport(eyeW, 0, eyeW, H);
    if (mesh && S.mode === 'sbs') setUV(mesh, 0.5, 0, 0.5, 1);
    else if (mesh && S.mode === 'tb') setUV(mesh, 0, 0, 1, 0.5);
    else if (mesh) resetUV(mesh);
    renderer3.render(scene3, camR);
  }
}

function setUV(mesh, ox, oy, rx, ry) {
  if (mesh.material.map) {
    mesh.material.map.offset.set(ox, oy);
    mesh.material.map.repeat.set(rx, ry);
    mesh.material.map.needsUpdate = true;
  }
}
function resetUV(mesh) { setUV(mesh, 0, 0, 1, 1); }

/* ═══════════════════════════════════════════════
   YouTube / Vimeo split
═══════════════════════════════════════════════ */
function buildIframeVR() {
  vrCanvas.style.display = 'none';
  ytVrWrap.classList.add('active');

  let src;
  if (S.source === 'youtube') {
    src = ytEmbed(S.ytId, '&mute=0');
  } else {
    src = `https://player.vimeo.com/video/${S.ytId}?autoplay=1&loop=1`;
  }

  const W = window.innerWidth, H = window.innerHeight;
  // Make iframe a bit bigger than half to avoid letterboxing
  const iW = Math.round(W * 0.56), iH = Math.round(H * 1.05);
  const offX = Math.round((W / 2 - iW) / 2);
  const offY = Math.round((H - iH) / 2);

  [eyeLeft, eyeRight].forEach(eye => {
    eye.innerHTML = `<iframe
      src="${src}"
      style="position:absolute;top:${offY}px;left:${offX}px;width:${iW}px;height:${iH}px;border:none;"
      allow="autoplay; encrypted-media; gyroscope; accelerometer"
      allowfullscreen
    ></iframe>`;
  });
}

/* ═══════════════════════════════════════════════
   Gyroscope
═══════════════════════════════════════════════ */
function handleOrientation(e) {
  S.orient.alpha = e.alpha || 0;
  S.orient.beta  = e.beta  || 0;
  S.orient.gamma = e.gamma || 0;
}

async function requestGyro() {
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const r = await DeviceOrientationEvent.requestPermission();
      if (r === 'granted') {
        window.addEventListener('deviceorientation', handleOrientation, true);
        S.gyroActive = true;
      } else {
        toast('陀螺儀權限被拒絕');
      }
    } catch {
      toast('無法取得陀螺儀權限');
    }
  } else {
    window.addEventListener('deviceorientation', handleOrientation, true);
    S.gyroActive = true;
  }
}

function stopGyro() {
  window.removeEventListener('deviceorientation', handleOrientation, true);
  S.gyroActive = false;
}

/* ═══════════════════════════════════════════════
   Enter / Exit VR
═══════════════════════════════════════════════ */
async function enterVR() {
  // Try landscape lock
  try {
    if (screen.orientation?.lock) await screen.orientation.lock('landscape');
  } catch { toast('請橫向握持手機放入 VR 盒子'); }

  // Fullscreen
  try {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } catch {}

  switchScreen(vrScreen);

  if (S.useGyro) await requestGyro();

  if (S.source === 'direct') {
    buildThreeVR();
  } else {
    buildIframeVR();
  }

  updateGyroBtn();
  toast('雙擊螢幕隱藏/顯示控制列', 3500);
}

function exitVR() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  stopGyro();

  bgVideo.pause();
  bgVideo.src = '';
  if (S.hlsInstance) { S.hlsInstance.destroy(); S.hlsInstance = null; }

  eyeLeft.innerHTML = '';
  eyeRight.innerHTML = '';

  if (renderer3) { renderer3.dispose(); renderer3 = null; }
  if (videoTex)  { videoTex.dispose(); videoTex = null; }
  if (rtTarget)  { rtTarget.dispose(); rtTarget = null; }

  try { if (document.exitFullscreen) document.exitFullscreen(); } catch {}
  try { if (screen.orientation?.unlock) screen.orientation.unlock(); } catch {}

  switchScreen(homeScreen);
}

/* ═══════════════════════════════════════════════
   Touch drag control (when gyro off)
═══════════════════════════════════════════════ */
vrScreen.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    dragState = { x: e.touches[0].clientX, y: e.touches[0].clientY, yaw: userYaw, pitch: userPitch };
  }
}, { passive: true });

vrScreen.addEventListener('touchmove', e => {
  if (!dragState || e.touches.length !== 1) return;
  const dx = e.touches[0].clientX - dragState.x;
  const dy = e.touches[0].clientY - dragState.y;
  userYaw   = dragState.yaw   + dx * 0.25;
  userPitch = Math.max(-80, Math.min(80, dragState.pitch - dy * 0.25));
}, { passive: true });

vrScreen.addEventListener('touchend', () => { dragState = null; }, { passive: true });

// Double-tap to toggle HUD
let lastTap = 0;
vrScreen.addEventListener('touchend', () => {
  const now = Date.now();
  if (now - lastTap < 300) {
    S.hudVisible = !S.hudVisible;
    vrHud.classList.toggle('hidden', !S.hudVisible);
  }
  lastTap = now;
}, { passive: true });

/* ═══════════════════════════════════════════════
   VR HUD buttons
═══════════════════════════════════════════════ */
$('vr-exit-btn').addEventListener('click', exitVR);

$('vr-gyro-btn').addEventListener('click', async () => {
  if (S.gyroActive) {
    stopGyro();
    S.resetQuat = null;
    toast('陀螺儀已關閉 — 可用手指拖曳');
  } else {
    await requestGyro();
    if (S.gyroActive) { S.resetQuat = null; toast('陀螺儀已開啟'); }
  }
  updateGyroBtn();
});

$('vr-reset-btn').addEventListener('click', () => {
  S.resetQuat = null;
  userYaw = 0;
  userPitch = 0;
  toast('視角已重設');
});

function updateGyroBtn() {
  const btn = $('vr-gyro-btn');
  if (S.gyroActive) {
    btn.textContent = '📱 陀螺儀：開';
    btn.classList.add('on');
  } else {
    btn.textContent = '📱 陀螺儀：關';
    btn.classList.remove('on');
  }
}

/* ═══════════════════════════════════════════════
   Window resize
═══════════════════════════════════════════════ */
window.addEventListener('resize', () => {
  if (!renderer3) return;
  const W = window.innerWidth, H = window.innerHeight;
  renderer3.setSize(W, H);
  if (rtTarget) {
    rtTarget.setSize(W, H);
  }
});

/* ═══════════════════════════════════════════════
   Home screen events
═══════════════════════════════════════════════ */
$('load-btn').addEventListener('click', loadVideo);
urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') loadVideo(); });

$('paste-btn').addEventListener('click', async () => {
  try {
    const text = await navigator.clipboard.readText();
    urlInput.value = text;
    toast('已貼上');
  } catch {
    urlInput.focus();
    document.execCommand('paste');
  }
});

$('settings-back').addEventListener('click', () => {
  clearPreview();
  switchScreen(homeScreen);
});

$('enter-vr-btn').addEventListener('click', enterVR);

// Service Worker registration
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
